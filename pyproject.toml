[project]
name = "breakout-scouting-web"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["Flask>=3.1.3,<4", "SQLAlchemy>=2.0.48,<3", "psycopg[binary]>=3.2.13,<4", "argon2-cffi>=25.1.0,<26", "certifi>=2025.7.14"]

[tool.vercel]
entrypoint = "web.app:app"

[tool.vercel.scripts]
build = "python scripts/build_web.py"
